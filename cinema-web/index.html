<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinema Web</title>
    <link rel="stylesheet" href="css/styles.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="site-logo">Cinema Web</h1>
            <nav class="main-nav" aria-label="Navegación principal">
                <ul id="list">
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#cartelera">Cartelera</a></li>
                    <li><a href="#">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container hero-inner">
                <h2 class="hero-title">Disfruta el mejor cine</h2>
                <p class="hero-subtitle">Películas seleccionadas para ti, en un ambiente cómodo y seguro.</p>
            </div>
        </section>
        <div class="principal">
            <aside class="aside-menu">
                <h3>Géneros</h3>

                <div id="genreContainer" class="genreClass">
                    <a href="#">Todos</a>
                </div>
            </aside>

            <section id="cartelera" class="cartelera container">
                <h3>Cartelera</h3>
                <div id="movieContainer" class="movie-grid" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; <span id="years"></span> Cinema Web. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="js/jquery.js" defer></script>
</body>

</html>
