<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto | Cinema Web</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="site-logo">Cinema Web</h1>
            <nav class="main-nav" aria-label="Navegación principal">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="index.html#cartelera">Cartelera</a></li>
                    <li><a href="contacto.html" aria-current="page">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="contact-section" aria-labelledby="contactTitle">
            <div class="container contact-section__inner">
                <h2 id="contactTitle" class="contact-section__title">Contacto</h2>
                <p class="contact-section__copy">Estamos disponibles para consultas sobre la cartelera y tus entradas.</p>
                <form id="contactForm" class="contact-form" aria-label="Formulario de contacto">
                    <div class="form-group">
                        <p id="errorNombre" class="error-message" aria-live="polite"></p>
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" name="name" minlength="3" maxlength="100">
                    </div>
                    <div class="form-group">
                        <p id="errorEdad" class="error-message" aria-live="polite"></p>
                        <label for="age">Edad:</label>
                        <input type="number" id="age" name="age" min="5" max="120" step="2" >
                    </div>
                    <div class="form-group">
                        <p id="errorEmail" class="error-message" aria-live="polite"></p>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" >
                    </div>
                    <div class="form-group">
                        <p id="errorMensaje" class="error-message" aria-live="polite"></p>
                        <label for="message">Mensaje:</label>
                        <textarea id="message" name="message" rows="5" ></textarea>
                    </div>
                    <button type="submit">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; 2026 Cinema Web. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="js/validaciones.js" defer></script>
</body>

</html>
